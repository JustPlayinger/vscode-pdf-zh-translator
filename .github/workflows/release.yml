name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 VSIX
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 编译 TypeScript
        run: npm run compile

      - name: 校验 viewer.html 替换锚点
        run: npm run check

      - name: 冒烟测试
        run: npm run smoke

      - name: 打包 VSIX
        run: npm run package

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
          draft: false
